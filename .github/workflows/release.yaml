name: "Ops: Release"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # To push commits, tags, and create releases
      packages: write # To publish packages
      checks: write # To publish check runs with test reports

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Fetch all history for all tags and branches
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
         distribution: 'temurin'
         java-version: '25'
         cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Node.js
        # Scala.js runs JS/Wasm tests on Node; the Wasm backend (1.22+) emits
        # ES2022 + WebAssembly GC, which needs a current Node, not the runner default.
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://npm.pkg.github.com"

      # Run sbt directly (no mise): the runner already has the JVM toolchain, jq, and gh,
      # so mise would only install the local-dev tool set for nothing. Runs the same gates
      # as `mise run check`, but deliberately in a different order: scalafmt first to fail
      # fast before any compile. `mise run check`'s clean-before-scalafmtCheckAll ordering
      # (#354) guards against a warm target/, which cannot happen here — the runner starts
      # from a fresh checkout, and setup-java's `cache: sbt` restores only ~/.sbt, ~/.ivy2
      # and the coursier cache, never sbt 2's compile CAS.
      # Runs sbt against a throwaway, repo-local build cache: a cache-served `compile`
      # skips the compiler, so nothing is instrumented and the 85% coverage threshold
      # goes silently unenforced (#531). Shared with `mise run coverage`/`check` via one
      # script so the two cannot drift; invoked with bash because the runner already has
      # the JVM toolchain and does not need mise (same as `bash .mise/tasks/package/prepare`).
      # `rootJVM/coverageDataCheck` then fails loudly if metadata is missing anyway.
      run: bash .mise/lib/sbt-cold-cache.sh 'scalafmtCheckAll; scalafixAll --check; clean; coverage; testOnly *; rootJVM/coverageDataCheck; coverageReport'
