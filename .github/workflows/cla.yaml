name: "CI: CLA"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify the PR author has signed the CLA
        uses: actions/github-script@v9
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            if (author === context.repo.owner) {
              console.log(`@${author} is the repository owner — CLA not required.`);
              return;
            }
            if (author.endsWith('[bot]')) {
              console.log(`@${author} is a bot account — CLA not required.`);
              return;
            }
            // The checkout above is the PR merge commit, so an entry added in this
            // same pull request counts — signing is part of the first contribution.
            const file = '.github/cla-signatures.json';
            let signatures;
            try {
              signatures = JSON.parse(require('fs').readFileSync(file, 'utf8')).signatures ?? [];
            } catch (error) {
              core.setFailed(`Cannot read ${file}: ${error.message}`);
              return;
            }
            const signed = signatures.some(
              (entry) => (entry.github ?? '').toLowerCase() === author.toLowerCase()
            );
            if (signed) {
              console.log(`@${author} has signed the CLA.`);
              return;
            }
            core.setFailed(
              `@${author} has not signed the Contributor License Agreement. ` +
              `Please read CLA.md and add yourself to ${file} in this pull request — ` +
              `the commit adding your entry is your electronic signature.`
            );
