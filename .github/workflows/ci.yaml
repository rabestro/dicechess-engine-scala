name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # Required to publish check runs with test reports
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # Disables shallow clones to enable accurate historical git analytics in SonarCloud
      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.0.0
        with:
         distribution: temurin
         java-version: '25'
         cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@93e926cbdb4a428e41b4ef754124ec82925ffdc2 # v1.1.5
      - name: Setup Node.js
        # Scala.js runs JS/Wasm tests on Node; the Wasm backend (1.22+) emits
        # ES2022 + WebAssembly GC, which needs a current Node, not the runner default.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Show sbt version
        run: sbt --version
      - name: scalafmt check
        run: sbt scalafmtCheckAll
      - name: Run tests with Coverage
        run: sbt clean coverage test coverageReport

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() # Always run even if tests fail!
        with:
          report_paths: '**/target/test-reports/*.xml'
          detailed_summary: true
          include_passed: true
      - name: Locate Scoverage report
        # The report path embeds the Scala version (jvm/target/scala-<ver>/...), so a
        # hardcoded path in sonar-project.properties silently goes stale on every
        # scalaVersion bump (#448: SonarCloud lost all coverage data for weeks after a
        # Dependabot bump, because the Scoverage sensor only WARNs, never fails, on a
        # missing report). Discover the real path at scan time and fail loudly if it's
        # missing, instead of letting SonarCloud quietly show zero coverage.
        id: scoverage
        run: |
          REPORT=$(find jvm/target -maxdepth 3 -path '*/scoverage-report/scoverage.xml' -print -quit)
          if [ -z "$REPORT" ]; then
            echo "::error::No scoverage.xml found under jvm/target — SonarQube coverage import would silently fail."
            exit 1
          fi
          echo "Found Scoverage report at $REPORT"
          echo "report_path=$REPORT" >> "$GITHUB_OUTPUT"
      - name: SonarQube Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.scala.coverage.reportPaths=${{ steps.scoverage.outputs.report_path }}
