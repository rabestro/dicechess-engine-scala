name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # Required to publish check runs with test reports
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # Disables shallow clones to enable accurate historical git analytics in SonarCloud
      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.0.0
        with:
         distribution: temurin
         java-version: '25'
         cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@93e926cbdb4a428e41b4ef754124ec82925ffdc2 # v1.1.5
      - name: Setup Node.js
        # Scala.js runs JS/Wasm tests on Node; the Wasm backend (1.22+) emits
        # ES2022 + WebAssembly GC, which needs a current Node, not the runner default.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Show sbt version
        run: sbt --version
      - name: scalafmt check
        run: sbt scalafmtCheckAll
      - name: Run tests with Coverage
        # Coverage runs against a throwaway, repo-local sbt build cache — load-bearing (#531).
        # Coverage on Scala 3 is the compiler's own `-coverage-out`, and the compiler writes
        # the instrumentation metadata. If sbt 2's action cache serves `compile`, the compiler
        # never runs, nothing is measured, and coverageReport only warns — the 85% threshold
        # goes silently unenforced. `clean` cannot help: the cache lives outside target/.
        # `shutdown` is required because -Dsbt.global.localcache is read at server startup.
        # A runner's cache is cold today, so this is belt-and-braces here, but it keeps CI
        # byte-identical to `mise run check`; coverageDataCheck fails loudly either way.
        run: |
          sbt shutdown >/dev/null 2>&1 || true
          rm -rf target/covcache
          sbt -Dsbt.global.localcache="$PWD/target/covcache" 'clean; coverage; testOnly *; rootJVM/coverageDataCheck; coverageReport'

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: always() # Always run even if tests fail!
        with:
          # sbt 2's shared build cache moved output from <platform>/target/... to
          # target/out/<platform>/scala-<ver>/<module>/...
          report_paths: '**/target/out/**/test-reports/*.xml'
          detailed_summary: true
          include_passed: true
      - name: Locate Scoverage report
        # The report path embeds the Scala version (target/out/jvm/scala-<ver>/...), so a
        # hardcoded path in sonar-project.properties silently goes stale on every
        # scalaVersion bump (#448: SonarCloud lost all coverage data for weeks after a
        # Dependabot bump, because the Scoverage sensor only WARNs, never fails, on a
        # missing report). Discover the real path at scan time and fail loudly if it's
        # missing, instead of letting SonarCloud quietly show zero coverage.
        id: scoverage
        run: |
          REPORT=$(find target/out/jvm -maxdepth 4 -path '*/scoverage-report/scoverage.xml' -print -quit)
          if [ -z "$REPORT" ]; then
            echo "::error::No scoverage.xml found under target/out/jvm — SonarQube coverage import would silently fail."
            exit 1
          fi
          echo "Found Scoverage report at $REPORT"
          echo "report_path=$REPORT" >> "$GITHUB_OUTPUT"
      - name: SonarQube Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.scala.coverage.reportPaths=${{ steps.scoverage.outputs.report_path }}
