name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Without this the job inherits the 6-hour default: an sbt server that hangs instead of
    # failing keeps the PR "in progress" all afternoon and burns the whole runner budget.
    # Observed on #561, where `scalafmtCheckAll` sat on a step that normally takes 13 s for
    # 50+ minutes until it was cancelled by hand. A full run is ~6 minutes; 30 leaves room
    # for a cold cache and still fails fast.
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write # Required to publish check runs with test reports
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Disables shallow clones to enable accurate historical git analytics in SonarCloud
      - name: Validate workflows
        # A broken workflow does not fail CI — it silently stops running, so its checks
        # disappear rather than turn red, and publish/release are never exercised by a
        # pull request at all. Invalid indentation reached main that way once already.
        # Checked here as well as in the pre-commit hook, because the hook can be skipped
        # with --no-verify.
        #
        # Same tool and version as the hook (mise.toml pins actionlint), so the two cannot
        # disagree. Downloaded rather than installed via mise: this job provisions its JVM
        # toolchain through setup-java/setup-sbt and deliberately does not use mise. The
        # version and the SHA-256 are both pinned, and the checksum is verified before the
        # binary runs — equivalent to the repo's SHA-pinning policy for actions.
        #
        # `-shellcheck=` matches the hook: actionlint picks shellcheck up from PATH when
        # present, and the runner has one, so leaving it on would lint `run:` bodies here
        # but not locally.
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          ./actionlint -shellcheck= -color
          rm -f "$archive" actionlint
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
         distribution: temurin
         java-version: '25'
         cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@bfea3c5f48abd221b04a6df4798aa5eb8b6a2baf # v1.5.6
      - name: Setup Node.js
        # Scala.js runs JS/Wasm tests on Node; the Wasm backend (1.22+) emits
        # ES2022 + WebAssembly GC, which needs a current Node, not the runner default.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Show sbt version
        run: sbt --version
      - name: scalafmt check
        # `--server` runs the build in the foreground instead of through sbtn. The thin
        # client is the default in sbt 2, and it swallows whatever kills the background
        # server: run 30940093788 exited 1 exactly 0.37 s after "set current project",
        # printing not one line — no "scalafmt: Checking N Scala sources", no formatting
        # error — while the identical tree had passed in the PR run 15 minutes earlier.
        # A bare exit code is undiagnosable after the fact, and the server log does not
        # survive the runner. This is also the first sbt invocation of the job, so there is
        # no server worth reusing, and leaving none behind suits the coverage step below,
        # which shuts the server down anyway to get its own `-Dsbt.global.localcache`.
        run: sbt --server scalafmtCheckAll
      - name: Run tests with Coverage
        # Runs sbt against a throwaway, repo-local build cache: a cache-served `compile` skips
        # the compiler, so nothing is instrumented and the 85% coverage threshold goes silently
        # unenforced (#531). Shared with `mise run coverage`/`check` via one script so the two
        # cannot drift; invoked with bash because the runner already provisions the JVM toolchain
        # and needs no mise (same pattern as `bash .mise/tasks/package/prepare`).
        # `rootJVM/coverageDataCheck` fails the build loudly if metadata is missing anyway.
        run: bash .mise/lib/sbt-cold-cache.sh 'clean; coverage; testOnly *; rootJVM/coverageDataCheck; arena/coverageDataCheck; coverageReport'

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: always() # Always run even if tests fail!
        with:
          # sbt 2's shared build cache moved output from <platform>/target/... to
          # target/out/<platform>/scala-<ver>/<module>/...
          report_paths: '**/target/out/**/test-reports/*.xml'
          detailed_summary: true
          include_passed: true
      - name: Locate Scoverage report
        # The report path embeds the Scala version (target/out/jvm/scala-<ver>/...), so a
        # hardcoded path in sonar-project.properties silently goes stale on every
        # scalaVersion bump (#448: SonarCloud lost all coverage data for weeks after a
        # Dependabot bump, because the Scoverage sensor only WARNs, never fails, on a
        # missing report). Discover the real path at scan time and fail loudly if it's
        # missing, instead of letting SonarCloud quietly show zero coverage.
        id: scoverage
        run: |
          REPORT=$(find target/out/jvm -maxdepth 4 -path '*/scoverage-report/scoverage.xml' -print -quit)
          if [ -z "$REPORT" ]; then
            echo "::error::No scoverage.xml found under target/out/jvm — SonarQube coverage import would silently fail."
            exit 1
          fi
          echo "Found Scoverage report at $REPORT"
          echo "report_path=$REPORT" >> "$GITHUB_OUTPUT"
      - name: SonarQube Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.scala.coverage.reportPaths=${{ steps.scoverage.outputs.report_path }}
