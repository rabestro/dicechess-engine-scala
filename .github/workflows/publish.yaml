name: "CD: Publish Package"

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
         distribution: temurin
         java-version: "25"
         cache: "sbt"

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      # Run sbt directly (no mise): the runner already has the JVM toolchain, jq, and gh,
      # so mise would only install the local-dev tool set for nothing. Runs the same gates
      # as `mise run check`, but deliberately in a different order: scalafmt first to fail
      # fast before any compile. `mise run check`'s clean-before-scalafmtCheckAll ordering
      # (#354) guards against a warm target/, which cannot happen here — the runner starts
      # from a fresh checkout, and setup-java's `cache: sbt` restores only ~/.sbt, ~/.ivy2
      # and the coursier cache, never sbt 2's compile CAS.
      # Coverage runs against a throwaway, repo-local sbt build cache — load-bearing (#531).
      # Coverage on Scala 3 is the compiler's own `-coverage-out`, and the compiler writes
      # the instrumentation metadata. If sbt 2's action cache serves `compile`, the compiler
      # never runs, nothing is measured, and coverageReport only warns — the 85% threshold
      # goes silently unenforced. `clean` cannot help: the cache lives outside target/.
      # `shutdown` is required because -Dsbt.global.localcache is read at server startup.
      # A runner's cache is cold today, so this is belt-and-braces here, but it keeps CI
      # byte-identical to `mise run check`; coverageDataCheck fails loudly either way.
      run: |
        sbt shutdown >/dev/null 2>&1 || true
        rm -rf target/covcache
        sbt -Dsbt.global.localcache="$PWD/target/covcache" 'scalafmtCheckAll; scalafixAll --check; clean; coverage; testOnly *; rootJVM/coverageDataCheck; coverageReport'

      - name: Publish JVM artifact to GitHub Packages (Maven)
        run: sbt "set ThisBuild / version := \"${GITHUB_REF_NAME#v}\"; rootJVM/publish"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # package:prepare is a plain bash script (sbt + jq, both on the runner). Run its
      # js:build dependency first, then the script directly — no mise needed.
      - name: Build JavaScript package
        run: |
          sbt rootJS/fullOptJS
          bash .mise/tasks/package/prepare

      - name: Build WebAssembly package
        run: |
          sbt rootWasm/fullLinkJS
          bash .mise/tasks/package/prepare-wasm

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://npm.pkg.github.com"

      - name: Publish JS package to GitHub Package Registry
        run: npm publish ./dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Wasm package to GitHub Package Registry
        run: npm publish ./dist-wasm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        run: |
          # Try to upload to the existing release first (created by Ops: Release)
          # If the release does not exist yet, fallback to creating it
          gh release upload "${{ github.ref_name }}" \
            dist/dicechess-engine.js \
            dist/dicechess-engine.d.ts \
            dist-wasm/main.js \
            dist-wasm/main.wasm \
            dist-wasm/__loader.js \
            --clobber || \
          gh release create "${{ github.ref_name }}" \
            dist/dicechess-engine.js \
            dist/dicechess-engine.d.ts \
            dist-wasm/main.js \
            dist-wasm/main.wasm \
            dist-wasm/__loader.js \
            --title "Release ${{ github.ref_name }}" \
            --notes "Automated release created by CI"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
