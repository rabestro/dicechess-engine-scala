# ==============================================================================
# SonarCloud Project Configuration
# ==============================================================================

# Unique identifier representing the organization on SonarCloud
sonar.organization=rabestro

# Project identity (generated during GitHub onboarding)
sonar.projectKey=rabestro_dicechess-engine-scala
sonar.projectName=dicechess-engine-scala

# Relative paths to source and test roots
# Shared and JVM-specific sources are included
sonar.sources=shared/src/main/scala,jvm/src/main/scala
sonar.tests=shared/src/test/scala,jvm/src/test/scala

# Exclude benchmark/match-runner code from coverage calculations
sonar.coverage.exclusions=**/bench/**

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# ==============================================================================
# Coverage Reporting (Telemetry import via sbt-scoverage)
# ==============================================================================

# Path to the generated XML report inside target subdirectory of the JVM project.
# SonarCloud consumes the native scoverage XML structure for detailed line analysis.
#
# This path embeds the Scala version and goes stale on every scalaVersion bump — CI
# (ci.yaml) discovers the real path at scan time and overrides this via -D, so this
# value only matters for ad-hoc local `sonar-scanner` runs. Keep it roughly in sync,
# but don't rely on it for CI correctness.
sonar.scala.coverage.reportPaths=target/out/jvm/scala-3.8.4/dicechess-engine-scala/scoverage-report/scoverage.xml
