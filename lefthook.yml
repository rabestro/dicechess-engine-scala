# Lefthook — Git hooks configuration
# Docs: https://github.com/evilmartians/lefthook
# Same standard as dicechess-analytics; rationale:
# https://jc.id.lv/posts/git-hooks-for-scala-in-milliseconds/

pre-commit:
  parallel: true
  jobs:
    # Secret scanning: abort if any staged diff leaks a credential
    # betterleaks is the successor by the gitleaks author (gitleaks is feature-frozen).
    # Detection only: no rule validation configured, nothing leaves the machine.
    - name: betterleaks
      run: betterleaks git --pre-commit --redact --staged

    # Native scalafmt CLI: milliseconds per commit. The pinned mise version must
    # match .scalafmt.conf (the native binary does not auto-dispatch versions).
    - name: scalafmt
      glob: "**.{scala,sbt}"
      run: scalafmt --test {staged_files}

    # A broken workflow does not fail CI — it silently stops running, so its checks
    # simply disappear rather than turn red, and publish/release are never exercised
    # by a pull request at all. That is exactly how invalid indentation reached main
    # once already.
    # actionlint (pinned in mise.toml) rather than an ad-hoc YAML parse: ruby was not
    # declared in this repo's toolchain, so a contributor without it could not commit
    # workflow changes, and `YAML.load_file` accepts duplicate keys silently while
    # actionlint rejects them. `-shellcheck=` disables the optional shell lint of
    # `run:` bodies — actionlint picks shellcheck up from PATH when present, and a
    # mise shim with no version installed makes it abort with a fatal error.
    - name: workflow-yaml
      glob: ".github/workflows/*.y*ml"
      run: actionlint -shellcheck= {staged_files}

# Pre-push is a hermetic one-second safety net, not a test gate: a full-project
# format check via the native CLI (no Docker, no network). It catches what the
# per-commit hook can miss: --no-verify commits, rebase/merge fallout.
# The full gate (tests + coverage) is `mise run check` before a PR — enforced by CI;
# heavy/integration checks on pre-push train the --no-verify reflex and block
# push-as-backup, so they deliberately live in CI only.
pre-push:
  jobs:
    - name: scalafmt-all
      glob: "**.{scala,sbt}"
      run: scalafmt --test .
